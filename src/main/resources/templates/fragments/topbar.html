<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header class="topbar" th:fragment="topbar(pageHeading, role)">
  <div class="topbar-left" th:text="${pageHeading}">Mon espace</div>
  <div class="topbar-right">
    <button type="button" class="topbar-icon" aria-label="Calendrier"><i class="fa-regular fa-calendar"></i></button>
    <button type="button" class="topbar-icon" aria-label="Messages"><i class="fa-regular fa-comment-dots"></i></button>
    <div class="user-chip" th:if="${currentUser != null}">
      <div class="user-meta">
        <div class="name" th:text="${currentUser.displayName}">Utilisateur</div>
        <div class="role" th:text="${currentUser.roleLabel}">Rôle</div>
      </div>
      <img class="avatar-sm" th:src="@{/img/avatar-default.svg}" src="/img/avatar-default.svg" alt="Avatar"/>
    </div>
  </div>
</header>
</body>
</html>

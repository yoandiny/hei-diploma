<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Notes — HEI Diploma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/hei-admin.css}" href="/css/hei-admin.css"/>
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('notes', 'TEACHER')}"></aside>
  <div class="main-wrap">
    <header th:replace="~{fragments/topbar :: topbar('Notes de mes cours', 'TEACHER')}"></header>
    <main class="content">
      <div class="card">
        <h2 class="section-title">Choisir un cours</h2>
        <div class="table-wrap">
          <table class="data">
            <thead>
            <tr>
              <th>Cours</th>
              <th>Groupes</th>
              <th></th>
            </tr>
            </thead>
            <tbody>
            <tr>
              <td>PROG4 — Programmation avancée</td>
              <td><span class="chip">K1</span> <span class="chip">K2</span></td>
              <td><a class="btn btn-sm btn-primary" th:href="@{/teacher/grades-edit.html}">Ouvrir</a></td>
            </tr>
            <tr>
              <td>WEB4 — Développement web</td>
              <td><span class="chip">K2</span> <span class="chip">K3</span></td>
              <td><a class="btn btn-sm btn-primary" th:href="@{/teacher/grades-edit.html}">Ouvrir</a></td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Notes — HEI Diploma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/hei-admin.css}" href="/css/hei-admin.css"/>
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('notes', 'TEACHER')}"></aside>
  <div class="main-wrap">
    <header th:replace="~{fragments/topbar :: topbar('Notes de mes cours', 'TEACHER')}"></header>
    <main class="content">
      <div class="btn-group" style="margin-bottom:1rem;">
        <a class="btn btn-primary" th:href="@{/teacher/exams-new.html}">
          <i class="fa-solid fa-plus"></i> Nouvel examen
        </a>
      </div>

      <div class="card">
        <h2 class="section-title">Examens à corriger ou consulter</h2>
        <div class="table-wrap">
          <table class="data">
            <thead>
            <tr>
              <th>Cours</th><th>Date</th><th>Groupes</th><th>Notes</th><th>Statut</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="exam : ${draftExams}">
              <td th:text="${exam.courseRef + ' — ' + exam.courseTitle}">Cours</td>
              <td th:text="${#temporals.format(exam.dateExam, 'dd/MM/yyyy')}">Date</td>
              <td><span class="chip" th:each="group : ${exam.groups}" th:text="${group.ref}">Groupe</span></td>
              <td th:text="${exam.gradedCount + ' / ' + exam.studentCount}">0 / 0</td>
              <td><span class="badge badge-warn">Brouillon</span></td>
              <td><a class="btn btn-sm btn-primary" th:href="@{/teacher/grades-edit.html(examId=${exam.examId})}">Ouvrir</a></td>
            </tr>
            <tr th:each="exam : ${submittedExams}">
              <td th:text="${exam.courseRef + ' — ' + exam.courseTitle}">Cours</td>
              <td th:text="${#temporals.format(exam.dateExam, 'dd/MM/yyyy')}">Date</td>
              <td><span class="chip" th:each="group : ${exam.groups}" th:text="${group.ref}">Groupe</span></td>
              <td th:text="${exam.gradedCount + ' / ' + exam.studentCount}">0 / 0</td>
              <td><span class="badge badge-ok">Soumis</span></td>
              <td><a class="btn btn-sm btn-outline" th:href="@{/teacher/grades-edit.html(examId=${exam.examId})}">Consulter</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(draftExams) && #lists.isEmpty(submittedExams)}"><td colspan="6">Aucun examen pour ce cours.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>

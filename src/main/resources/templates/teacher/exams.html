<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Examens — HEI Diploma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/hei-admin.css}" href="/css/hei-admin.css"/>
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('examens', 'TEACHER')}"></aside>
  <div class="main-wrap">
    <header th:replace="~{fragments/topbar :: topbar('Mes examens', 'TEACHER')}"></header>
    <main class="content">
      <div class="alert alert-success" role="alert" th:if="${success}" th:text="${success}">OK</div>
      <div class="alert alert-warning" role="alert" th:if="${error}" th:text="${error}">Erreur.</div>

      <div class="toolbar">
        <form class="btn-group" method="get" th:action="@{/teacher/exams.html}">
          <div class="form-field" style="min-width:220px;">
            <label for="courseId">Cours</label>
            <select id="courseId" name="courseId" onchange="this.form.submit()">
              <option value="">Tous mes cours</option>
              <option th:each="course : ${courses}" th:value="${course.courseId}"
                      th:selected="${courseId != null and #strings.equals(courseId, course.courseId)}"
                      th:text="${course.ref + ' — ' + course.title}">PROG4</option>
            </select>
          </div>
        </form>
        <a class="btn btn-primary" th:href="@{/teacher/exams-new.html}">
          <i class="fa-solid fa-plus"></i> Nouvel examen
        </a>
      </div>

      <div class="card">
        <h2 class="section-title">Examens <span th:text="|(${#lists.size(exams)})|">(0)</span></h2>
        <div class="empty" th:if="${exams.empty}">Aucun examen pour le moment.</div>
        <div class="table-wrap" th:unless="${exams.empty}">
          <table class="data">
            <thead>
            <tr>
              <th>Cours</th>
              <th>Date</th>
              <th>Sur</th>
              <th>Classes</th>
              <th>Notes</th>
              <th>Statut</th>
              <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="exam : ${exams}">
              <td th:text="${exam.courseRef}">PROG4</td>
              <td th:text="${exam.dateExam}">date</td>
              <td th:text="${exam.maxGrade}">20</td>
              <td th:text="${exam.groupRefs}">K1</td>
              <td th:text="${exam.gradedCount + ' / ' + exam.studentCount}">0 / 0</td>
              <td>
                <span class="badge badge-ok" th:if="${exam.submitted}">Soumis</span>
                <span class="badge badge-muted" th:unless="${exam.submitted}">Brouillon</span>
              </td>
              <td class="btn-group">
                <a class="btn btn-sm btn-outline"
                   th:href="@{/teacher/exams-detail.html(examId=${exam.examId})}">Détail</a>
                <a class="btn btn-sm btn-primary" th:if="${!exam.submitted}"
                   th:href="@{/teacher/grades-edit.html(examId=${exam.examId})}">Saisir</a>
                <a class="btn btn-sm btn-outline" th:if="${exam.submitted}"
                   th:href="@{/teacher/grades-edit.html(examId=${exam.examId})}">Consulter</a>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>

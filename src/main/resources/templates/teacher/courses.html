<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Mes cours — HEI Diploma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/hei-admin.css}" href="/css/hei-admin.css"/>
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('cours', 'TEACHER')}"></aside>
  <div class="main-wrap">
    <header th:replace="~{fragments/topbar :: topbar('Mes cours', 'TEACHER')}"></header>
    <main class="content">
      <div class="card">
        <h2 class="section-title">Cours enseignés</h2>
        <p style="color:var(--hei-muted);margin-top:0;font-size:0.9rem;">
          Seuls les cours et groupes qui vous sont affectés apparaissent ici.
        </p>
        <div class="empty" th:if="${courses.empty}">Aucun cours ne vous est affecté.</div>
        <div class="table-wrap" th:unless="${courses.empty}">
          <table class="data">
            <thead>
            <tr>
              <th>Code</th>
              <th>Intitulé</th>
              <th>Groupes concernés</th>
              <th>Effectif</th>
              <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="course : ${courses}">
              <td th:text="${course.ref}">PROG4</td>
              <td th:text="${course.title}">Programmation avancée</td>
              <td>
                <a class="chip" th:each="group : ${course.groups}"
                   th:href="@{/teacher/grades-edit.html(courseId=${course.courseId}, groupId=${group.groupId})}"
                   th:text="${group.ref}">K1</a>
              </td>
              <td th:text="${course.studentCount}">0</td>
              <td>
                <a class="btn btn-sm btn-outline"
                   th:if="${!course.groups.empty}"
                   th:href="@{/teacher/grades-edit.html(courseId=${course.courseId}, groupId=${course.groups[0].groupId})}">
                  Notes
                </a>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>

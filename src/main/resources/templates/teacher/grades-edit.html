<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Saisie des notes — HEI Diploma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/hei-admin.css}" href="/css/hei-admin.css"/>
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('notes', 'TEACHER')}"></aside>
  <div class="main-wrap">
    <header th:replace="~{fragments/topbar :: topbar(${pageHeading}, 'TEACHER')}"></header>
    <main class="content">
      <div class="alert alert-success" role="alert" th:if="${success}" th:text="${success}">OK</div>
      <div class="alert alert-warning" role="alert" th:if="${error}" th:text="${error}">Erreur.</div>

      <div class="btn-group" style="margin-bottom:1rem;">
        <a class="btn btn-outline" th:href="@{/teacher/grades-home.html}">
          <i class="fa-solid fa-arrow-left"></i> Retour
        </a>
        <a class="btn btn-outline" th:href="@{/teacher/exams-detail.html(examId=${exam.examId})}">
          Fiche examen
        </a>
      </div>

      <div class="card">
        <h2 class="section-title">
          <span th:text="${exam.courseRef}">PROG4</span>
          — notes sur
          <span th:text="${exam.maxGrade}">20</span>
          <span class="badge badge-ok" th:if="${exam.submitted}" style="margin-left:0.5rem;">Soumis</span>
          <span class="badge badge-muted" th:unless="${exam.submitted}" style="margin-left:0.5rem;">Brouillon</span>
        </h2>
        <div class="exam-meta">
          <span>Classes : <strong th:text="${exam.groupRefs}">K1</strong></span>
          <span>Notes : <strong th:text="${exam.gradedCount + ' / ' + exam.studentCount}">0 / 0</strong></span>
        </div>

        <form class="btn-group" method="get" th:action="@{/teacher/grades-edit.html}"
              th:if="${examGroups != null and examGroups.size() > 1}" style="margin-bottom:1rem;">
          <input type="hidden" name="examId" th:value="${exam.examId}"/>
          <div class="form-field" style="min-width:200px;">
            <label for="groupId">Classe</label>
            <select id="groupId" name="groupId">
              <option value="">Toutes les classes</option>
              <option th:each="group : ${examGroups}" th:value="${group.groupId}"
                      th:selected="${groupId != null and #strings.equals(groupId, group.groupId)}"
                      th:text="${group.ref}">K1</option>
            </select>
          </div>
          <button type="submit" class="btn btn-outline" style="align-self:flex-end;">Filtrer</button>
        </form>

        <div class="empty" th:if="${sheet.rows.empty}">Aucun étudiant.</div>
        <div class="table-wrap" th:unless="${sheet.rows.empty}">
          <table class="data">
            <thead>
            <tr>
              <th>Réf.</th>
              <th>Étudiant</th>
              <th>Classe</th>
              <th>Note / <span th:text="${exam.maxGrade}">20</span></th>
              <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${sheet.rows}">
              <td th:text="${row.studentNumber}">STD24001</td>
              <td th:text="${row.fullName}">Nom</td>
              <td><span class="badge badge-info" th:text="${row.groupRef}">K1</span></td>
              <td th:if="${exam.submitted}" th:text="${row.currentValue != null ? row.currentValue : '—'}">—</td>
              <td th:unless="${exam.submitted}">
                <form class="btn-group" style="align-items:center; flex-wrap:wrap; gap:0.5rem;" th:action="@{/teacher/grades}" method="post">
                  <input type="hidden" name="examId" th:value="${exam.examId}"/>
                  <input type="hidden" name="groupId" th:if="${groupId != null and !groupId.isEmpty()}" th:value="${groupId}"/>
                  <input type="hidden" name="studentId" th:value="${row.studentId}"/>
                  <input type="number" name="value" step="0.01" min="0" required style="width:5rem;"
                         th:max="${exam.maxGrade}"
                         th:placeholder="${exam.maxGrade}"
                         th:value="${row.currentValue}"/>
                  <input type="text" name="reason"
                         placeholder="Motif"
                         style="width:9rem;"
                         th:title="${row.gradeId != null ? 'Obligatoire pour modifier une note' : 'Optionnel pour la saisie initiale'}"
                         th:required="${row.gradeId != null}"/>
                  <button type="submit" class="btn btn-sm btn-primary">Enregistrer</button>
                </form>
              </td>
              <td>
                <a class="btn btn-sm btn-outline" th:if="${row.gradeId != null}"
                   th:href="@{/teacher/grade-history.html(gradeId=${row.gradeId}, examId=${exam.examId}, groupId=${groupId})}">
                  Histo
                </a>
              </td>
            </tr>
            </tbody>
          </table>
        </div>

        <div class="btn-group" style="margin-top:1.1rem;" th:if="${!exam.submitted}">
          <a class="btn btn-gold" th:href="@{/teacher/exams-detail.html(examId=${exam.examId})}">
            Soumettre l'examen
          </a>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>

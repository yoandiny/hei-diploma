<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Saisie des notes — HEI Diploma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/hei-admin.css}" href="/css/hei-admin.css"/>
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('notes', 'TEACHER')}"></aside>
  <div class="main-wrap">
    <header th:replace="~{fragments/topbar :: topbar(${pageHeading}, 'TEACHER')}"></header>
    <main class="content">
      <div class="alert alert-warning">
        Toute modification de note exige un <strong>motif obligatoire</strong> et alimente l'historique.
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;">
          <h2 class="section-title" style="margin:0;" th:text="${exam.courseRef + ' — examen du ' + #temporals.format(exam.dateExam, 'dd/MM/yyyy')}">Examen</h2>
        </div>

        <div class="table-wrap">
          <table class="data">
            <thead>
            <tr>
              <th>Réf.</th>
              <th>Étudiant</th>
              <th>Groupe</th>
              <th>Note actuelle</th>
              <th>Nouvelle note</th>
              <th>Motif de modification</th>
              <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${sheet.rows}">
              <td th:text="${row.studentNumber}">STD</td>
              <td th:text="${row.fullName}">Étudiant</td>
              <td th:text="${row.groupRef}">Groupe</td>
              <td th:text="${row.currentValue != null ? row.currentValue : '—'}">—</td>
              <td colspan="3">
                <form class="btn-group" style="align-items:flex-start;" th:action="@{/teacher/grades}" method="post">
                  <input type="hidden" name="examId" th:value="${examId}"/>
                  <input type="hidden" name="groupId" th:value="${groupId}"/>
                  <input type="hidden" name="studentId" th:value="${row.studentId}"/>
                  <input type="number" name="value" step="0.01" min="0" max="20" required th:value="${row.currentValue}" style="width:5.5rem;"/>
                  <input type="text" name="reason" placeholder="Motif requis seulement en cas de modification" style="min-width:14rem;flex:1;"/>
                  <button type="submit" class="btn btn-sm btn-primary" th:disabled="${exam.submitted}">Enregistrer</button>
                  <a class="btn btn-sm btn-outline" th:if="${row.gradeId != null}" th:href="@{/teacher/grade-history.html(gradeId=${row.gradeId},examId=${examId},groupId=${groupId})}">Histo</a>
                </form>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(sheet.rows)}"><td colspan="7">Aucun étudiant dans les groupes sélectionnés.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>

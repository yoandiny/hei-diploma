<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Historique de note — HEI Diploma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/hei-admin.css}" href="/css/hei-admin.css"/>
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('notes', 'TEACHER')}"></aside>
  <div class="main-wrap">
    <header th:replace="~{fragments/topbar :: topbar('Historique de note', 'TEACHER')}"></header>
    <main class="content">
      <div class="btn-group" style="margin-bottom:1rem;">
        <a class="btn btn-outline"
           th:href="@{/teacher/grades-edit.html(courseId=${courseId}, groupId=${groupId}, examId=${examId})}">
          <i class="fa-solid fa-arrow-left"></i> Retour à la saisie
        </a>
      </div>

      <div class="card">
        <h2 class="section-title"
            th:text="${history.grade.exam.course.ref + ' / ' + history.grade.student.studentNumber + ' — ' + (history.grade.student.user != null ? history.grade.student.user.fullName : '')}">
          Historique
        </h2>
        <div class="empty" th:if="${history.entries.empty}">Aucun historique pour cette note.</div>
        <ul class="timeline" th:unless="${history.entries.empty}">
          <li th:each="entry : ${history.entries}">
            <div class="when" th:text="${entry.changedAt} + ' · par ' + ${entry.changedByName}">date</div>
            <div class="what"
                 th:text="${(entry.previousValue != null ? entry.previousValue : '—') + ' → ' + entry.newValue}">
              15.0 → 16.5
            </div>
            <div class="why" th:text="${'Motif : ' + entry.reason}">Motif</div>
          </li>
        </ul>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>

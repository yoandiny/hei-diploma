<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Dashboard enseignant — HEI Diploma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/hei-admin.css}" href="/css/hei-admin.css"/>
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('dashboard', 'TEACHER')}"></aside>
  <div class="main-wrap">
    <header th:replace="~{fragments/topbar :: topbar('Dashboard enseignant', 'TEACHER')}"></header>
    <main class="content">
      <div class="stats">
        <div class="stat-card"><div class="label">Cours assignés</div><div class="value" th:text="${courseCount}">0</div></div>
        <div class="stat-card"><div class="label">Groupes</div><div class="value" th:text="${groupCount}">0</div></div>
        <div class="stat-card"><div class="label">Étudiants</div><div class="value" th:text="${studentCount}">0</div></div>
        <div class="stat-card"><div class="label">Examens à saisir</div><div class="value" th:text="${openExamCount}">0</div></div>
      </div>


      <div class="card">
        <h2 class="section-title">Mes cours</h2>
        <div class="table-wrap">
          <table class="data">
            <thead>
            <tr>
              <th>Code</th>
              <th>Intitulé</th>
              <th>Groupes</th>
              <th>Étudiants</th>
              <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="course : ${courses}">
              <td th:text="${course.ref}">CODE</td>
              <td th:text="${course.title}">Cours</td>
              <td><span class="chip" th:each="group : ${course.groups}" th:text="${group.ref}">Groupe</span></td>
              <td th:text="${course.studentCount}">0</td>
              <td><a class="btn btn-sm btn-primary" th:href="@{/teacher/grades-home.html(courseId=${course.courseId})}">Voir les examens</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(courses)}"><td colspan="5">Aucun cours ne vous est affecté.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>

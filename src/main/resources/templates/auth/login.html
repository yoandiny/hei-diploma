<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Connexion — HEI Diploma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/hei-admin.css}" href="/css/hei-admin.css"/>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark">HEI</div>
      <h1>HEI Diploma</h1>
    </div>

    <div class="alert alert-warning" role="alert" th:if="${param.error}">
      <strong th:if="${param.error[0] == 'disabled'}">Ce compte est désactivé.</strong>
      <strong th:if="${param.error[0] == 'server'}">Impossible de se connecter pour le moment. Réessayez.</strong>
      <strong th:unless="${param.error[0] == 'disabled' or param.error[0] == 'server'}">Email ou mot de passe incorrect.</strong>
    </div>
    <div class="alert alert-info" role="alert" th:if="${param.logout}">
      Vous êtes déconnecté.
    </div>

    <form th:action="@{/login}" method="post">
      <div class="form-field" style="margin-bottom:0.85rem;">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" placeholder="prenom@mail.hei.school" required/>
      </div>
      <div class="form-field">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" name="password" placeholder="••••••••" required/>
      </div>

      <button type="submit" class="btn btn-primary">Se connecter</button>
    </form>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Mes relevés — HEI Diploma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/hei-admin.css}" href="/css/hei-admin.css"/>
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('releves', 'STUDENT')}"></aside>
  <div class="main-wrap">
    <header th:replace="~{fragments/topbar :: topbar('Mes relevés', 'STUDENT')}"></header>
    <main class="content">
      <div class="card">
        <h2 class="section-title">Relevés de notes</h2>
        <div class="empty" th:if="${transcript == null}">Aucun relevé pour le moment.</div>
        <div class="table-wrap" th:unless="${transcript == null}">
          <table class="data">
            <thead>
            <tr>
              <th>Année</th>
              <th>Semestre</th>
              <th>Moyenne</th>
              <th>Statut</th>
              <th></th>
            </tr>
            </thead>
            <tbody>
            <tr>
              <td th:text="${transcript.promotionStartYear + '–' + transcript.promotionEndYear}">—</td>
              <td>—</td>
              <td th:text="${transcript.weightedAverage != null ? transcript.weightedAverage : '—'}">—</td>
              <td>
                <span class="badge badge-ok"
                      th:if="${transcript.weightedAverage != null && transcript.weightedAverage.compareTo(T(java.math.BigDecimal).TEN) >= 0}">Validé</span>
                <span class="badge badge-info" th:unless="${transcript.weightedAverage != null && transcript.weightedAverage.compareTo(T(java.math.BigDecimal).TEN) >= 0}">En cours</span>
              </td>
              <td><a class="btn btn-sm btn-outline" th:href="@{/students/me/transcript}"><i class="fa-solid fa-download"></i> JSON</a></td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>

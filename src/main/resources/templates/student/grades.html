<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Mes notes — HEI Diploma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/hei-admin.css}" href="/css/hei-admin.css"/>
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('notes', 'STUDENT')}"></aside>
  <div class="main-wrap">
    <header th:replace="~{fragments/topbar :: topbar('Mes notes', 'STUDENT')}"></header>
    <main class="content">
      <div class="alert alert-info">
        Consultation en lecture seule : un étudiant ne peut voir que ses propres notes.
      </div>

      <div class="card">
        <h2 class="section-title">Mes notes</h2>
        <div class="empty" th:if="${transcript == null || #lists.isEmpty(transcript.grades)}">Aucune note pour le moment.</div>
        <div class="table-wrap" th:unless="${transcript == null || #lists.isEmpty(transcript.grades)}">
          <table class="data">
            <thead>
            <tr>
              <th>Code</th>
              <th>Cours</th>
              <th>Épreuve</th>
              <th>Note</th>
              <th>Coeff.</th>
              <th>Date</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="grade : ${transcript.grades}">
              <td th:text="${grade.courseRef}">PROG4</td>
              <td th:text="${grade.courseTitle}">Programmation avancée</td>
              <td>—</td>
              <td><strong th:text="${grade.value}">0</strong></td>
              <td th:text="${grade.coefficient}">0</td>
              <td th:text="${grade.examDate}">—</td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>

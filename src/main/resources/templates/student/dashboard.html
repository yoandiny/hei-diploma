<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Dashboard — HEI Diploma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/hei-admin.css}" href="/css/hei-admin.css"/>
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('dashboard', 'STUDENT')}"></aside>
  <div class="main-wrap">
    <header th:replace="~{fragments/topbar :: topbar('Dashboard', 'STUDENT')}"></header>
    <main class="content">
      <div class="stats">
        <div class="stat-card">
          <div class="label">Moyenne générale</div>
          <div class="value" th:text="${transcript != null && transcript.weightedAverage != null ? transcript.weightedAverage : '—'}">0</div>
        </div>
        <div class="stat-card">
          <div class="label">Notes visibles</div>
          <div class="value" th:text="${transcript != null ? #lists.size(transcript.grades) : 0}">0</div>
        </div>
        <div class="stat-card">
          <div class="label">Groupe</div>
          <div class="value" th:text="${transcript != null && transcript.groupRef != null ? transcript.groupRef : '—'}">—</div>
        </div>
      </div>

      <div class="card">
        <h2 class="section-title">Dernières notes</h2>
        <div class="empty" th:if="${transcript == null || #lists.isEmpty(transcript.grades)}">Aucune note pour le moment.</div>
        <div class="table-wrap" th:unless="${transcript == null || #lists.isEmpty(transcript.grades)}">
          <table class="data">
            <thead>
            <tr>
              <th>Cours</th>
              <th>Note</th>
              <th>Date</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="grade : ${transcript.grades}">
              <td th:text="${grade.courseRef + ' — ' + grade.courseTitle}">PROG4 — Programmation avancée</td>
              <td><strong th:text="${grade.value}">0</strong></td>
              <td th:text="${grade.examDate}">—</td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>

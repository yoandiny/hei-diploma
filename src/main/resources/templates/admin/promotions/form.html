<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${promotion == null} ? 'Nouvelle promotion — HEI Diploma' : 'Éditer une promotion — HEI Diploma'">
    Formulaire promotion — HEI Diploma
  </title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/hei-admin.css}" href="/css/hei-admin.css"/>
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('groupes', 'ADMIN')}"></aside>
  <div class="main-wrap">
    <header th:replace="~{fragments/topbar :: topbar(${pageHeading}, 'ADMIN')}"></header>
    <main class="content">
      <div class="alert alert-warning" role="alert" th:if="${error}" th:text="${error}">Erreur.</div>

      <div class="card">
        <h2 class="section-title" th:text="${promotion == null} ? 'Nouvelle promotion' : 'Éditer une promotion'">
          Promotion
        </h2>
        <form th:action="@{/admin/promotions/save}" method="post" class="form-grid">
          <input type="hidden" name="id" th:if="${promotion != null}" th:value="${promotion.id}"/>
          <div class="form-field full">
            <label class="required" for="label">Libellé</label>
            <input id="label" name="label" type="text" placeholder="L1 2024" required
                   th:value="${promotion != null ? promotion.label : ''}"/>
          </div>
          <div class="form-field">
            <label class="required" for="startYear">Année de début</label>
            <input id="startYear" name="startYear" type="number" min="2000" max="2100" step="1" required
                   th:value="${promotion != null ? promotion.startYear : 2024}"/>
          </div>
          <div class="form-field">
            <label class="required" for="endYear">Année de fin</label>
            <input id="endYear" name="endYear" type="number" min="2000" max="2100" step="1" required
                   th:value="${promotion != null ? promotion.endYear : 2027}"/>
          </div>
          <div class="full btn-group">
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <a class="btn btn-outline" th:href="@{/admin/groups/list.html}">Annuler</a>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>

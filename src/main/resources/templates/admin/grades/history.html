<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Historique des notes — HEI Diploma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/hei-admin.css}" href="/css/hei-admin.css"/>
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('historique', 'ADMIN')}"></aside>
  <div class="main-wrap">
    <header th:replace="~{fragments/topbar :: topbar('Historique des notes', 'ADMIN')}"></header>
    <main class="content">
      <div class="card">
        <h2 class="section-title">
          Journal des modifications
          <span th:text="|(${#lists.size(changes)})|">(0)</span>
        </h2>
        <div class="empty" th:if="${#lists.isEmpty(changes)}">Aucune modification de note pour le moment.</div>
        <div class="table-wrap" th:unless="${#lists.isEmpty(changes)}">
          <table class="data">
            <thead>
            <tr>
              <th>Date</th>
              <th>Cours</th>
              <th>Étudiant</th>
              <th>Avant</th>
              <th>Après</th>
              <th>Par</th>
              <th>Motif</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="change : ${changes}">
              <td th:text="${change.changedAt}">date</td>
              <td th:text="${change.courseRef}">PROG4</td>
              <td th:text="${change.studentNumber + ' — ' + change.studentName}">STD — Nom</td>
              <td th:text="${change.previousValue != null ? change.previousValue : '—'}">—</td>
              <td><strong th:text="${change.newValue}">16.5</strong></td>
              <td th:text="${change.changedByName}">Enseignant</td>
              <td th:text="${change.reason}">Motif</td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>

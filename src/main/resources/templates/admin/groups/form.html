<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${group == null} ? 'Nouveau groupe — HEI Diploma' : 'Éditer un groupe — HEI Diploma'">
    Formulaire groupe — HEI Diploma
  </title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/hei-admin.css}" href="/css/hei-admin.css"/>
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('groupes', 'ADMIN')}"></aside>
  <div class="main-wrap">
    <header th:replace="~{fragments/topbar :: topbar(${pageHeading}, 'ADMIN')}"></header>
    <main class="content">
      <div class="alert alert-warning" role="alert" th:if="${error}" th:text="${error}">Erreur.</div>
      <div class="alert alert-warning" role="alert" th:if="${promotions.empty}">
        Créez d'abord une promotion avant d'ajouter un groupe.
        <a th:href="@{/admin/promotions/form.html}">Nouvelle promotion</a>
      </div>

      <div class="card">
        <h2 class="section-title" th:text="${group == null} ? 'Nouveau groupe' : 'Éditer un groupe'">Groupe</h2>
        <form th:action="@{/admin/groups/save}" method="post" class="form-grid">
          <input type="hidden" name="id" th:if="${group != null}" th:value="${group.id}"/>
          <div class="form-field">
            <label class="required" for="ref">Référence</label>
            <input id="ref" name="ref" type="text" placeholder="K1" required
                   th:value="${group != null ? group.ref : ''}"/>
          </div>
          <div class="form-field">
            <label class="required" for="promotionId">Promotion</label>
            <select id="promotionId" name="promotionId" required>
              <option value="">Choisir…</option>
              <option th:each="promotion : ${promotions}" th:value="${promotion.id}"
                      th:selected="${group != null and group.promotion != null and #strings.equals(group.promotion.id.toString(), promotion.id.toString())}"
                      th:text="|${promotion.label} (${promotion.startYear}–${promotion.endYear})|">
                Promo
              </option>
            </select>
          </div>
          <div class="full btn-group">
            <button type="submit" class="btn btn-primary" th:disabled="${promotions.empty}">Enregistrer</button>
            <a class="btn btn-outline" th:href="@{/admin/groups/list.html}">Annuler</a>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>

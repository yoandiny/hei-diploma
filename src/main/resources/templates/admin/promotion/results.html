<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Résultats promotion — HEI Diploma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/hei-admin.css}" href="/css/hei-admin.css"/>
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('promotion', 'ADMIN')}"></aside>
  <div class="main-wrap">
    <header th:replace="~{fragments/topbar :: topbar('Résultats de promotion (3 ans)', 'ADMIN')}"></header>
    <main class="content">
      <div class="card" style="margin-bottom:1rem;">
        <form class="btn-group" method="get" th:action="@{/admin/promotion/results.html}">
          <div class="form-field" style="min-width:200px;">
            <label for="promo">Promotion</label>
            <select id="promo" name="promotionId" required>
              <option value="">Choisir une promotion</option>
              <option th:each="item : ${promotions}" th:value="${item.id}" th:text="${item.label + ' (' + item.startYear + '–' + item.endYear + ')'}" th:selected="${item.id == selectedPromotionId}">Promotion</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary" style="align-self:flex-end;">Afficher</button>
        </form>
      </div>

      <div class="alert alert-warning" th:if="${error}" th:text="${error}">Erreur.</div>
      <div class="card" th:if="${promotion != null}">
        <h2 class="section-title" th:text="${'Promotion ' + promotion.label + ' — diplômés'}">Diplômés</h2>
        <div class="table-wrap">
          <table class="data">
            <thead>
            <tr>
              <th>Étudiant</th><th>Matricule</th><th>Groupe</th><th>Moyenne générale</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="graduate : ${graduates}"><td th:text="${graduate.student.user.fullName}">Étudiant</td><td th:text="${graduate.student.studentNumber}">STD</td><td th:text="${graduate.student.currentGroup != null ? graduate.student.currentGroup.ref : '—'}">—</td><td th:text="${graduate.weightedAverage}">0</td></tr>
            <tr th:if="${#lists.isEmpty(graduates)}"><td colspan="4">Aucun diplômé pour cette promotion.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>

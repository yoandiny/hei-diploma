<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Enseignants — HEI Diploma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/hei-admin.css}" href="/css/hei-admin.css"/>
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('enseignants', 'ADMIN')}"></aside>
  <div class="main-wrap">
    <header th:replace="~{fragments/topbar :: topbar('Enseignants', 'ADMIN')}"></header>
    <main class="content">
      <div class="alert alert-success" role="alert" th:if="${success}" th:text="${success}">Enregistré.</div>
      <div class="alert alert-warning" role="alert" th:if="${error}" th:text="${error}">Erreur.</div>

      <div class="btn-group" style="margin-bottom:1rem;">
        <a class="btn btn-primary" th:href="@{/admin/teachers/form.html}">
          <i class="fa-solid fa-plus"></i> Nouvel enseignant
        </a>
      </div>

      <div class="card">
        <h2 class="section-title">
          Enseignants
          <span th:text="|(${#lists.size(teachers)})|">(0)</span>
        </h2>
        <div class="empty" th:if="${teachers.empty}">Aucun enseignant pour le moment.</div>
        <div class="table-wrap" th:unless="${teachers.empty}">
          <table class="data">
            <thead>
            <tr>
              <th>Matricule</th>
              <th>Nom</th>
              <th>Email</th>
              <th>Statut</th>
              <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="teacher : ${teachers}">
              <td th:text="${teacher.employeeNumber}">TCH001</td>
              <td th:text="${teacher.user != null ? teacher.user.fullName : '—'}">Nom</td>
              <td th:text="${teacher.user != null ? teacher.user.email : '—'}">mail@hei.school</td>
              <td>
                <span class="badge badge-info" th:if="${teacher.user != null && teacher.user.enabled}">Actif</span>
                <span th:if="${teacher.user == null || !teacher.user.enabled}">Désactivé</span>
              </td>
              <td class="btn-group">
                <a class="btn btn-sm btn-outline" th:href="@{/admin/teachers/form.html(id=${teacher.id})}">Éditer</a>
                <form th:action="@{/admin/teachers/{id}/delete(id=${teacher.id})}" method="post" style="display:inline;"
                      onsubmit="return confirm('Supprimer cet enseignant ?');">
                  <button type="submit" class="btn btn-sm btn-danger">Supprimer</button>
                </form>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>

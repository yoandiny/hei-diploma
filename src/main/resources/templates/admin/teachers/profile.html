<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${teacher != null && teacher.user != null ? teacher.user.fullName + ' — HEI Diploma' : 'Profil enseignant — HEI Diploma'}">
    Profil enseignant — HEI Diploma
  </title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/hei-admin.css}" href="/css/hei-admin.css"/>
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('enseignants', 'ADMIN')}"></aside>
  <div class="main-wrap">
    <header th:replace="~{fragments/topbar :: topbar(${pageHeading}, 'ADMIN')}"></header>
    <main class="content">
      <div class="alert alert-success" role="alert" th:if="${success}" th:text="${success}">OK</div>
      <div class="alert alert-warning" role="alert" th:if="${error}" th:text="${error}">Erreur.</div>

      <section class="profile-hero">
        <div class="profile-banner"></div>
        <div class="profile-head">
          <img class="profile-avatar" th:src="@{/img/avatar-default.svg}" src="/img/avatar-default.svg" alt="Photo de profil"/>
          <div class="profile-identity">
            <h1 th:text="${teacher.user != null ? teacher.user.fullName : 'Enseignant'}">Nom</h1>
            <div class="meta">
              <span th:text="${teacher.employeeNumber}">TCH001</span>
            </div>
          </div>
          <div class="profile-actions btn-group">
            <form th:action="@{/admin/teachers/{id}/delete(id=${teacher.id})}" method="post"
                  onsubmit="return confirm('Supprimer cet enseignant ?');">
              <button type="submit" class="btn btn-danger">Supprimer</button>
            </form>
          </div>
        </div>
      </section>

      <div class="grid-2">
        <div class="card">
          <h2 class="section-title">Modifier le profil</h2>
          <form th:action="@{/admin/teachers/{id}/profile(id=${teacher.id})}" method="post" class="form-grid">
            <div class="form-field">
              <label class="required" for="firstName">Prénom</label>
              <input id="firstName" name="firstName" type="text" required
                     th:value="${teacher.user != null ? teacher.user.firstName : ''}"/>
            </div>
            <div class="form-field">
              <label class="required" for="lastName">Nom</label>
              <input id="lastName" name="lastName" type="text" required
                     th:value="${teacher.user != null ? teacher.user.lastName : ''}"/>
            </div>
            <div class="form-field">
              <label class="required" for="email">Email</label>
              <input id="email" name="email" type="email" required
                     th:value="${teacher.user != null ? teacher.user.email : ''}"/>
            </div>
            <div class="form-field">
              <label class="required" for="employeeNumber">Numéro d'employé</label>
              <input id="employeeNumber" name="employeeNumber" type="text" required
                     th:value="${teacher.employeeNumber}"/>
            </div>
            <div class="form-field">
              <label for="password">Nouveau mot de passe</label>
              <input id="password" name="password" type="password" autocomplete="new-password"
                     placeholder="Laisser vide pour ne pas changer"/>
            </div>
            <div class="form-field">
              <label for="enabled">Compte actif</label>
              <label style="font-weight:500;display:flex;gap:0.5rem;align-items:center;">
                <input id="enabled" name="enabled" type="checkbox" value="true"
                       th:checked="${teacher.user != null && teacher.user.enabled}"/>
                Peut se connecter
              </label>
            </div>
            <div class="full btn-group">
              <button type="submit" class="btn btn-primary">Enregistrer</button>
            </div>
          </form>
        </div>
        <div class="card">
          <h2 class="section-title">Compte</h2>
          <div class="info-stack">
            <div class="info-item">
              <span class="info-icon"><i class="fa-regular fa-envelope"></i></span>
              <div>
                <span class="label">Email</span>
                <span class="value" th:text="${teacher.user != null ? teacher.user.email : '—'}">mail@hei.school</span>
              </div>
            </div>
            <div class="info-item">
              <span class="info-icon"><i class="fa-solid fa-id-badge"></i></span>
              <div>
                <span class="label">Numéro d'employé</span>
                <span class="value" th:text="${teacher.employeeNumber}">TCH001</span>
              </div>
            </div>
            <div class="info-item">
              <span class="info-icon"><i class="fa-solid fa-circle-check"></i></span>
              <div>
                <span class="label">Statut</span>
                <span class="value" th:if="${teacher.user != null && teacher.user.enabled}">Actif</span>
                <span class="value" th:if="${teacher.user == null || !teacher.user.enabled}">Désactivé</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <p style="margin-top:1rem;">
        <a class="btn btn-outline" th:href="@{/admin/teachers/list.html}">Retour à la liste</a>
      </p>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>

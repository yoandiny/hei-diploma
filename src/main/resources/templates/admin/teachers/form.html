<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${teacher == null} ? 'Nouvel enseignant — HEI Diploma' : 'Éditer un enseignant — HEI Diploma'">
    Formulaire enseignant — HEI Diploma
  </title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/hei-admin.css}" href="/css/hei-admin.css"/>
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('enseignants', 'ADMIN')}"></aside>
  <div class="main-wrap">
    <header th:replace="~{fragments/topbar :: topbar(${pageHeading}, 'ADMIN')}"></header>
    <main class="content">
      <div class="alert alert-warning" role="alert" th:if="${error}" th:text="${error}">Erreur.</div>

      <div class="card">
        <h2 class="section-title" th:text="${teacher == null} ? 'Nouvel enseignant' : 'Éditer un enseignant'">
          Enseignant
        </h2>
        <form th:action="@{/admin/teachers/save}" method="post" class="form-grid">
          <input type="hidden" name="id" th:if="${teacher != null}" th:value="${teacher.id}"/>
          <div class="form-field">
            <label class="required" for="firstName">Prénom</label>
            <input id="firstName" name="firstName" type="text" required
                   th:value="${teacher != null && teacher.user != null ? teacher.user.firstName : ''}"/>
          </div>
          <div class="form-field">
            <label class="required" for="lastName">Nom</label>
            <input id="lastName" name="lastName" type="text" required
                   th:value="${teacher != null && teacher.user != null ? teacher.user.lastName : ''}"/>
          </div>
          <div class="form-field">
            <label class="required" for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="prenom@mail.hei.school" required
                   th:value="${teacher != null && teacher.user != null ? teacher.user.email : ''}"/>
          </div>
          <div class="form-field">
            <label class="required" for="employeeNumber">Numéro d'employé</label>
            <input id="employeeNumber" name="employeeNumber" type="text" placeholder="TCH001" required
                   th:value="${teacher != null ? teacher.employeeNumber : ''}"/>
          </div>
          <div class="form-field">
            <label class="required" for="password" th:text="${teacher == null} ? 'Mot de passe' : 'Nouveau mot de passe'">
              Mot de passe
            </label>
            <input id="password" name="password" type="password" autocomplete="new-password"
                   th:required="${teacher == null}"
                   th:placeholder="${teacher == null} ? '••••••••' : 'Laisser vide pour ne pas changer'"/>
          </div>
          <div class="form-field">
            <label for="enabled">Compte actif</label>
            <label style="font-weight:500;display:flex;gap:0.5rem;align-items:center;">
              <input id="enabled" name="enabled" type="checkbox" value="true"
                     th:checked="${teacher == null || (teacher.user != null && teacher.user.enabled)}"/>
              Peut se connecter
            </label>
          </div>
          <div class="full btn-group">
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <a class="btn btn-outline" th:href="@{/admin/teachers/list.html}">Annuler</a>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>

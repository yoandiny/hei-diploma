<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Formulaire cours — HEI Diploma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/hei-admin.css}" href="/css/hei-admin.css"/>
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('cours', 'ADMIN')}"></aside>
  <div class="main-wrap">
    <header th:replace="~{fragments/topbar :: topbar('Nouveau / éditer un cours', 'ADMIN')}"></header>
    <main class="content">
      <div class="card">
        <h2 class="section-title">Cours</h2>
        <form th:action="@{/admin/cours}" method="post" class="form-grid">
          <div class="form-field">
            <label class="required" for="code">Code</label>
            <input id="code" name="code" type="text" value="PROG4" required/>
          </div>
          <div class="form-field">
            <label class="required" for="title">Intitulé</label>
            <input id="title" name="title" type="text" value="Programmation avancée" required/>
          </div>

          <div class="form-field full">
            <label class="required" for="teachers">Enseignants (multi-sélection)</label>
            <select id="teachers" name="teachers" multiple required>
              <option value="Rakoto Jean" selected>Rakoto Jean</option>
              <option value="Ravelo Marie" selected>Ravelo Marie</option>
              <option value="Andrianina Paul">Andrianina Paul</option>
              <option value="Rasoa Lala">Rasoa Lala</option>
            </select>
            <span class="hint">Un cours peut être enseigné par plusieurs enseignants. Maintenez Ctrl/Cmd pour multi-sélectionner.</span>
          </div>

          <div class="form-field full">
            <label for="groups">Groupes concernés</label>
            <select id="groups" name="groups" multiple>
              <option value="K1" selected>K1</option>
              <option value="K2" selected>K2</option>
              <option value="K3">K3</option>
              <option value="G1">G1</option>
              <option value="G2">G2</option>
            </select>
            <span class="hint">Pas forcément tous les groupes : sélectionnez uniquement ceux concernés.</span>
          </div>

          <div class="full btn-group">
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <a class="btn btn-outline" th:href="@{/admin/courses/list.html}">Annuler</a>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>

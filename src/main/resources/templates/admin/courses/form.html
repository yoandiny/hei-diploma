<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Formulaire cours — HEI Diploma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/hei-admin.css}" href="/css/hei-admin.css"/>
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('cours', 'ADMIN')}"></aside>
  <div class="main-wrap">
    <header th:replace="~{fragments/topbar :: topbar('Nouveau / éditer un cours', 'ADMIN')}"></header>
    <main class="content">
      <div class="card">
        <h2 class="section-title">Cours</h2>
        <form th:action="@{/admin/courses/save}" method="post" class="form-grid">
          <input type="hidden" name="id" th:if="${course != null}" th:value="${course.id}"/>
          <div class="form-field">
            <label class="required" for="code">Code</label>
            <input id="code" name="ref" type="text" required th:value="${course != null ? course.ref : ''}"/>
          </div>
          <div class="form-field">
            <label class="required" for="title">Intitulé</label>
            <input id="title" name="title" type="text" required th:value="${course != null ? course.title : ''}"/>
          </div>

          <div class="form-field full">
            <label class="required" for="credits">Crédits</label>
            <input id="credits" name="credits" type="number" min="0" required th:value="${course != null ? course.credits : ''}"/>
          </div>

          <div class="full btn-group">
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <a class="btn btn-outline" th:href="@{/admin/courses/list.html}">Annuler</a>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>

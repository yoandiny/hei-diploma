<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Gestion des cours — HEI Diploma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/hei-admin.css}" href="/css/hei-admin.css"/>
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('cours', 'ADMIN')}"></aside>
  <div class="main-wrap">
    <header th:replace="~{fragments/topbar :: topbar('Gestion des cours', 'ADMIN')}"></header>
    <main class="content">
      <div class="btn-group" style="margin-bottom:1rem;">
        <a class="btn btn-primary" th:href="@{/admin/courses/form.html}">
          <i class="fa-solid fa-plus"></i> Nouveau cours
        </a>
      </div>

      <div class="card">
        <h2 class="section-title">Cours</h2>
        <div class="table-wrap">
          <table class="data">
            <thead>
            <tr>
              <th>Code</th>
              <th>Intitulé</th>
              <th>Enseignants</th>
              <th>Groupes</th>
              <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${courseRows}">
              <td th:text="${row.course.ref}">CODE</td>
              <td th:text="${row.course.title}">Cours</td>
              <td><span class="chip" th:each="teacher : ${row.teachers}" th:text="${teacher.user.fullName}">Enseignant</span><span th:if="${#lists.isEmpty(row.teachers)}">—</span></td>
              <td><span class="chip" th:each="group : ${row.groups}" th:text="${group.ref}">Groupe</span><span th:if="${#lists.isEmpty(row.groups)}">—</span></td>
              <td class="btn-group">
                <a class="btn btn-sm btn-outline" th:href="@{/admin/courses/form.html(id=${row.course.id})}">Éditer</a>
                <a class="btn btn-sm btn-primary" th:href="@{/admin/courses/assign-groups.html(courseId=${row.course.id})}">Affectations</a>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(courseRows)}"><td colspan="5">Aucun cours pour le moment.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Gestion des cours — HEI Diploma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/hei-admin.css}" href="/css/hei-admin.css"/>
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('cours', 'ADMIN')}"></aside>
  <div class="main-wrap">
    <header th:replace="~{fragments/topbar :: topbar('Gestion des cours', 'ADMIN')}"></header>
    <main class="content">
      <div class="alert alert-success" role="alert" th:if="${success}" th:text="${success}">Enregistré.</div>
      <div class="alert alert-warning" role="alert" th:if="${error}" th:text="${error}">Erreur.</div>

      <div class="btn-group" style="margin-bottom:1rem;">
        <a class="btn btn-primary" th:href="@{/admin/courses/form.html}">
          <i class="fa-solid fa-plus"></i> Nouveau cours
        </a>
      </div>

      <div class="card">
        <h2 class="section-title">
          Cours
          <span th:text="|(${#lists.size(courses)})|">(0)</span>
        </h2>
        <div class="empty" th:if="${courses.empty}">Aucun cours pour le moment.</div>
        <div class="table-wrap" th:unless="${courses.empty}">
          <table class="data">
            <thead>
            <tr>
              <th>Code</th>
              <th>Intitulé</th>
              <th>Crédits</th>
              <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="course : ${courses}">
              <td th:text="${course.ref}">PROG4</td>
              <td th:text="${course.title}">Programmation avancée</td>
              <td th:text="${course.credits}">6</td>
              <td class="btn-group">
                <a class="btn btn-sm btn-outline" th:href="@{/admin/courses/form.html(id=${course.id})}">Éditer</a>
                <a class="btn btn-sm btn-primary" th:href="@{/admin/courses/assign-groups.html(courseId=${course.id})}">Affectations</a>
                <form th:action="@{/admin/courses/{id}/delete(id=${course.id})}" method="post" style="display:inline;"
                      onsubmit="return confirm('Supprimer ce cours ?');">
                  <button type="submit" class="btn btn-sm btn-danger">Supprimer</button>
                </form>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Affectations cours — HEI Diploma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/hei-admin.css}" href="/css/hei-admin.css"/>
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('cours', 'ADMIN')}"></aside>
  <div class="main-wrap">
    <header th:replace="~{fragments/topbar :: topbar('Affectations cours / enseignants / groupes', 'ADMIN')}"></header>
    <main class="content">
      <div class="alert alert-success" role="alert" th:if="${success}" th:text="${success}">OK</div>
      <div class="alert alert-warning" role="alert" th:if="${error}" th:text="${error}">Erreur</div>

      <div class="card">
        <h2 class="section-title" th:text="|${course.ref} — ${course.title}|">PROG4 — Programmation avancée</h2>

        <form th:action="@{/admin/courses/{id}/assignments(id=${course.id})}" method="post" class="form-grid" style="margin-bottom:1.5rem;">
          <div class="form-field">
            <label class="required" for="teacherId">Enseignant</label>
            <select id="teacherId" name="teacherId" required>
              <option value="">Choisir…</option>
              <option th:each="teacher : ${teachers}" th:value="${teacher.id}"
                      th:text="${teacher.user.fullName + ' (' + teacher.employeeNumber + ')'}">
                Nom
              </option>
            </select>
          </div>
          <div class="form-field full">
            <label class="required" for="groupIds">Groupes</label>
            <select id="groupIds" name="groupIds" multiple required size="6">
              <option th:each="group : ${groups}" th:value="${group.id}"
                      th:text="${group.ref + (group.promotion != null ? ' — ' + group.promotion.label : '')}">
                K1
              </option>
            </select>
          </div>
          <div class="full btn-group">
            <button type="submit" class="btn btn-primary">Ajouter l'affectation</button>
            <a class="btn btn-outline" th:href="@{/admin/courses/list.html}">Retour aux cours</a>
          </div>
        </form>

        <h2 class="section-title">Affectations actuelles</h2>
        <div class="empty" th:if="${assignments.empty}">Aucune affectation pour ce cours.</div>
        <div class="table-wrap" th:unless="${assignments.empty}">
          <table class="data">
            <thead>
            <tr>
              <th>Enseignant</th>
              <th>Groupe</th>
              <th>Promotion</th>
              <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="assignment : ${assignments}">
              <td th:text="${assignment.teacher.user.fullName}">Enseignant</td>
              <td><span class="badge badge-info" th:text="${assignment.group.ref}">K1</span></td>
              <td th:text="${assignment.group.promotion != null ? assignment.group.promotion.label : '—'}">Promo</td>
              <td>
                <form th:action="@{/admin/courses/assignments/{id}/delete(id=${assignment.id})}" method="post"
                      style="display:inline;" onsubmit="return confirm('Retirer cette affectation ?');">
                  <input type="hidden" name="courseId" th:value="${course.id}"/>
                  <button type="submit" class="btn btn-sm btn-danger">Retirer</button>
                </form>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>

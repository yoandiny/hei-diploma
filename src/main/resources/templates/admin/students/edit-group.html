<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Changer de groupe — HEI Diploma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/hei-admin.css}" href="/css/hei-admin.css"/>
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('etudiants', 'ADMIN')}"></aside>
  <div class="main-wrap">
    <header th:replace="~{fragments/topbar :: topbar('Changer de groupe', 'ADMIN')}"></header>
    <main class="content">
      <div class="alert alert-warning" role="alert" th:if="${error}" th:text="${error}">Erreur.</div>

      <div class="card" style="max-width:560px;">
        <h2 class="section-title" th:text="${student.user != null ? student.user.fullName : 'Étudiant'}">Nom</h2>
        <p style="margin-top:0;color:var(--hei-muted);">
          <span th:text="${student.studentNumber}">STD24001</span>
          · Groupe actuel :
          <strong th:text="${student.currentGroup != null ? student.currentGroup.ref : '—'}">—</strong>
        </p>

        <form th:action="@{/admin/students/{id}/group(id=${student.id})}" method="post" class="form-grid">
          <div class="form-field full">
            <label class="required" for="groupId">Nouveau groupe</label>
            <select id="groupId" name="groupId" required>
              <option value="">Choisir…</option>
              <option th:each="group : ${groups}" th:value="${group.id}"
                      th:selected="${student.currentGroup != null and #strings.equals(student.currentGroup.id.toString(), group.id.toString())}"
                      th:text="${group.ref}">K1</option>
            </select>
          </div>
          <div class="full btn-group">
            <button type="submit" class="btn btn-primary">Mettre à jour le groupe</button>
            <a class="btn btn-outline" th:href="@{/admin/students/list.html}">Annuler</a>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Changer de groupe — HEI Diploma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/hei-admin.css}" href="/css/hei-admin.css"/>
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('etudiants', 'ADMIN')}"></aside>
  <div class="main-wrap">
    <header th:replace="~{fragments/topbar :: topbar(${pageHeading}, 'ADMIN')}"></header>
    <main class="content">
      <div class="card" style="max-width:560px;">
        <h2 class="section-title" th:text="${student.user.fullName}">Étudiant</h2>
        <p style="margin-top:0;color:var(--hei-muted);" th:text="${student.studentNumber + ' · Groupe actuel : ' + (student.currentGroup != null ? student.currentGroup.ref : '—')}">Étudiant</p>

        <form th:action="@{/admin/etudiants/STD24005/groupe}" method="post" class="form-grid">
          <div class="form-field full">
            <label class="required" for="group">Nouveau groupe</label>
            <select id="group" name="groupId" required>
              <option th:each="group : ${groups}" th:value="${group.id}" th:text="${group.ref}" th:selected="${student.currentGroup != null && group.id == student.currentGroup.id}">Groupe</option>
            </select>
            <span class="hint">Le changement est possible à tout moment du parcours.</span>
          </div>
          <div class="form-field full">
            <label for="reason">Motif (optionnel)</label>
            <textarea id="reason" name="reason" placeholder="Ex. Rééquilibrage des effectifs"></textarea>
          </div>
          <div class="full btn-group">
            <button type="submit" class="btn btn-primary">Mettre à jour le groupe</button>
            <a class="btn btn-outline" th:href="@{/admin/students/list.html}">Annuler</a>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>

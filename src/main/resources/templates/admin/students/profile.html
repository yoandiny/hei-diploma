<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${student != null && student.user != null ? student.user.fullName + ' — HEI Diploma' : 'Profil étudiant — HEI Diploma'}">
    Profil étudiant — HEI Diploma
  </title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/hei-admin.css}" href="/css/hei-admin.css"/>
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('etudiants', 'ADMIN')}"></aside>
  <div class="main-wrap">
    <header th:replace="~{fragments/topbar :: topbar(${pageHeading}, 'ADMIN')}"></header>
    <main class="content">
      <div class="alert alert-success" role="alert" th:if="${success}" th:text="${success}">OK</div>
      <div class="alert alert-warning" role="alert" th:if="${error}" th:text="${error}">Erreur.</div>

      <section class="profile-hero">
        <div class="profile-banner"></div>
        <div class="profile-head">
          <img class="profile-avatar" th:src="@{/img/avatar-default.svg}" src="/img/avatar-default.svg" alt="Photo de profil"/>
          <div class="profile-identity">
            <h1 th:text="${student.user != null ? student.user.fullName : 'Étudiant'}">Nom</h1>
            <div class="meta">
              <span th:text="${student.studentNumber}">STD24001</span>
              <span th:if="${student.currentGroup != null}"
                    th:text="${' · ' + student.currentGroup.ref}"> · K1</span>
            </div>
          </div>
          <div class="profile-actions btn-group">
            <a class="btn btn-outline"
               th:href="@{/admin/students/edit-group.html(id=${student.id})}">Changer de groupe</a>
            <form th:if="${student.user != null && student.user.enabled}"
                  th:action="@{/admin/students/{id}/suspend(id=${student.id}, redirect='profile')}"
                  method="post">
              <button type="submit" class="btn btn-outline">Suspendre</button>
            </form>
            <form th:if="${student.user == null || !student.user.enabled}"
                  th:action="@{/admin/students/{id}/unsuspend(id=${student.id}, redirect='profile')}"
                  method="post">
              <button type="submit" class="btn btn-outline">Réactiver</button>
            </form>
            <form th:action="@{/admin/students/{id}/delete(id=${student.id})}" method="post"
                  onsubmit="return confirm('Supprimer cet étudiant ?');">
              <button type="submit" class="btn btn-danger">Supprimer</button>
            </form>
          </div>
        </div>
      </section>

      <div class="grid-2">
        <div class="card">
          <h2 class="section-title">Compte</h2>
          <div class="info-stack">
            <div class="info-item">
              <span class="info-icon"><i class="fa-regular fa-envelope"></i></span>
              <div>
                <span class="label">Email</span>
                <span class="value" th:text="${student.user != null ? student.user.email : '—'}">mail@hei.school</span>
              </div>
            </div>
            <div class="info-item">
              <span class="info-icon"><i class="fa-solid fa-circle-check"></i></span>
              <div>
                <span class="label">Statut</span>
                <span class="value" th:if="${student.user != null && student.user.enabled}">Actif</span>
                <span class="value" th:if="${student.user == null || !student.user.enabled}">Suspendu</span>
              </div>
            </div>
          </div>
        </div>
        <div class="card">
          <h2 class="section-title">Scolarité</h2>
          <div class="info-stack">
            <div class="info-item">
              <span class="info-icon"><i class="fa-solid fa-graduation-cap"></i></span>
              <div>
                <span class="label">Promotion</span>
                <span class="value"
                      th:text="${student.promotion != null ? student.promotion.label : '—'}">Promo</span>
              </div>
            </div>
            <div class="info-item">
              <span class="info-icon"><i class="fa-solid fa-users"></i></span>
              <div>
                <span class="label">Groupe actuel</span>
                <span class="value"
                      th:text="${student.currentGroup != null ? student.currentGroup.ref : '—'}">K1</span>
              </div>
            </div>
            <div class="info-item">
              <span class="info-icon"><i class="fa-regular fa-id-card"></i></span>
              <div>
                <span class="label">Numéro d'étudiant</span>
                <span class="value" th:text="${student.studentNumber}">STD24001</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <p style="margin-top:1rem;">
        <a class="btn btn-outline" th:href="@{/admin/students/list.html}">Retour à la liste</a>
      </p>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>

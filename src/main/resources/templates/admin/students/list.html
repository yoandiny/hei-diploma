<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Étudiants — HEI Diploma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/hei-admin.css}" href="/css/hei-admin.css"/>
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('etudiants', 'ADMIN')}"></aside>
  <div class="main-wrap">
    <header th:replace="~{fragments/topbar :: topbar('Étudiants', 'ADMIN')}"></header>
    <main class="content">
      <div class="alert alert-info">
        Un étudiant peut changer de groupe à tout moment durant son parcours.
      </div>

      <div class="card">
        <h2 class="section-title">Liste des étudiants</h2>
        <div class="table-wrap">
          <table class="data">
            <thead>
            <tr>
              <th>Référence</th>
              <th>Nom</th>
              <th>Groupe actuel</th>
              <th>Année</th>
              <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="student : ${students}">
              <td th:text="${student.studentNumber}">STD</td>
              <td th:text="${student.user != null ? student.user.fullName : '—'}">Étudiant</td>
              <td><span class="badge badge-info" th:text="${student.currentGroup != null ? student.currentGroup.ref : '—'}">—</span></td>
              <td th:text="${student.promotion != null ? student.promotion.label : '—'}">—</td>
              <td class="btn-group"><a class="btn btn-sm btn-outline" th:href="@{/admin/students/profile.html(id=${student.id})}">Profil</a><a class="btn btn-sm btn-primary" th:href="@{/admin/students/edit-group.html(id=${student.id})}">Changer de groupe</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(students)}"><td colspan="5">Aucun étudiant pour le moment.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>

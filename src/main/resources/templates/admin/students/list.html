<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Étudiants — HEI Diploma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/hei-admin.css}" href="/css/hei-admin.css"/>
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('etudiants', 'ADMIN')}"></aside>
  <div class="main-wrap">
    <header th:replace="~{fragments/topbar :: topbar('Étudiants', 'ADMIN')}"></header>
    <main class="content">
      <div class="card">
        <h2 class="section-title">
          Liste des étudiants
          <span th:text="|(${#lists.size(students)})|">(0)</span>
        </h2>
        <div class="empty" th:if="${students.empty}">
          Aucun étudiant pour le moment.
        </div>
        <div class="table-wrap" th:unless="${students.empty}">
          <table class="data">
            <thead>
            <tr>
              <th>Référence</th>
              <th>Nom</th>
              <th>Groupe actuel</th>
              <th>Promotion</th>
              <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="student : ${students}">
              <td th:text="${student.studentNumber}">STD24001</td>
              <td th:text="${student.user != null ? student.user.fullName : '—'}">Nom</td>
              <td>
                <span class="badge badge-info" th:if="${student.currentGroup != null}"
                      th:text="${student.currentGroup.ref}">K1</span>
                <span th:if="${student.currentGroup == null}">—</span>
              </td>
              <td th:text="${student.promotion != null ? student.promotion.label : '—'}">Promo</td>
              <td>
                <a class="btn btn-sm btn-primary"
                   th:href="@{/admin/students/edit-group.html(id=${student.id})}">
                  Changer de groupe
                </a>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Étudiants — HEI Diploma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/hei-admin.css}" href="/css/hei-admin.css"/>
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('etudiants', 'ADMIN')}"></aside>
  <div class="main-wrap">
    <header th:replace="~{fragments/topbar :: topbar('Étudiants', 'ADMIN')}"></header>
    <main class="content">
      <div class="alert alert-success" role="alert" th:if="${success}" th:text="${success}">Enregistré.</div>
      <div class="alert alert-warning" role="alert" th:if="${error}" th:text="${error}">Erreur.</div>

      <div class="btn-group" style="margin-bottom:1rem;">
        <a class="btn btn-primary" th:href="@{/admin/students/form.html}">
          <i class="fa-solid fa-plus"></i> Nouvel étudiant
        </a>
      </div>

      <div class="card">
        <h2 class="section-title">
          Liste des étudiants
          <span th:text="|(${#lists.size(students)})|">(0)</span>
        </h2>
        <div class="empty" th:if="${students.empty}">
          Aucun étudiant pour le moment.
        </div>
        <div class="table-wrap" th:unless="${students.empty}">
          <table class="data">
            <thead>
            <tr>
              <th>Référence</th>
              <th>Nom</th>
              <th>Groupe actuel</th>
              <th>Promotion</th>
              <th>Statut</th>
              <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="student : ${students}">
              <td th:text="${student.studentNumber}">STD24001</td>
              <td th:text="${student.user != null ? student.user.fullName : '—'}">Nom</td>
              <td>
                <span class="badge badge-info" th:if="${student.currentGroup != null}"
                      th:text="${student.currentGroup.ref}">K1</span>
                <span th:if="${student.currentGroup == null}">—</span>
              </td>
              <td th:text="${student.promotion != null ? student.promotion.label : '—'}">Promo</td>
              <td>
                <span class="badge badge-ok"
                      th:if="${student.user != null && student.user.enabled}">Actif</span>
                <span class="badge badge-warn"
                      th:if="${student.user == null || !student.user.enabled}">Suspendu</span>
              </td>
              <td class="btn-group">
                <a class="btn btn-sm btn-outline"
                   th:href="@{/admin/students/profile.html(id=${student.id})}">Profil</a>
                <a class="btn btn-sm btn-outline"
                   th:href="@{/admin/students/edit-group.html(id=${student.id})}">Groupe</a>
                <form th:if="${student.user != null && student.user.enabled}"
                      th:action="@{/admin/students/{id}/suspend(id=${student.id})}"
                      method="post" style="display:inline;">
                  <button type="submit" class="btn btn-sm btn-outline">Suspendre</button>
                </form>
                <form th:if="${student.user == null || !student.user.enabled}"
                      th:action="@{/admin/students/{id}/unsuspend(id=${student.id})}"
                      method="post" style="display:inline;">
                  <button type="submit" class="btn btn-sm btn-outline">Réactiver</button>
                </form>
                <form th:action="@{/admin/students/{id}/delete(id=${student.id})}" method="post"
                      style="display:inline;"
                      onsubmit="return confirm('Supprimer cet étudiant ?');">
                  <button type="submit" class="btn btn-sm btn-danger">Supprimer</button>
                </form>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>

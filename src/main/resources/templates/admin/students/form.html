<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Nouvel étudiant — HEI Diploma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/hei-admin.css}" href="/css/hei-admin.css"/>
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('etudiants', 'ADMIN')}"></aside>
  <div class="main-wrap">
    <header th:replace="~{fragments/topbar :: topbar('Nouvel étudiant', 'ADMIN')}"></header>
    <main class="content">
      <div class="alert alert-warning" role="alert" th:if="${error}" th:text="${error}">Erreur.</div>

      <div class="card">
        <h2 class="section-title">Nouvel étudiant</h2>
        <form th:action="@{/admin/students/save}" method="post" class="form-grid">
          <div class="form-field">
            <label class="required" for="firstName">Prénom</label>
            <input id="firstName" name="firstName" type="text" required/>
          </div>
          <div class="form-field">
            <label class="required" for="lastName">Nom</label>
            <input id="lastName" name="lastName" type="text" required/>
          </div>
          <div class="form-field">
            <label class="required" for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="prenom@mail.hei.school" required/>
          </div>
          <div class="form-field">
            <label class="required" for="studentNumber">Numéro d'étudiant</label>
            <input id="studentNumber" name="studentNumber" type="text" placeholder="STD24001" required/>
          </div>
          <div class="form-field">
            <label class="required" for="password">Mot de passe</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required
                   placeholder="••••••••"/>
          </div>
          <div class="form-field">
            <label class="required" for="promotionId">Promotion</label>
            <select id="promotionId" name="promotionId" required>
              <option value="">Choisir…</option>
              <option th:each="promotion : ${promotions}" th:value="${promotion.id}"
                      th:text="${promotion.label}">Promo
              </option>
            </select>
          </div>
          <div class="form-field">
            <label for="groupId">Groupe</label>
            <select id="groupId" name="groupId">
              <option value="">Aucun</option>
              <option th:each="group : ${groups}" th:value="${group.id}"
                      th:attr="data-promotion-id=${group.promotion != null ? group.promotion.id : ''}"
                      th:text="${group.ref + (group.promotion != null ? ' — ' + group.promotion.label : '')}">
                K1
              </option>
            </select>
          </div>
          <div class="form-field">
            <label for="enabled">Compte actif</label>
            <label style="font-weight:500;display:flex;gap:0.5rem;align-items:center;">
              <input id="enabled" name="enabled" type="checkbox" value="true" checked/>
              Peut se connecter
            </label>
          </div>
          <div class="full btn-group">
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <a class="btn btn-outline" th:href="@{/admin/students/list.html}">Annuler</a>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
<script>
  (function () {
    const promotionSelect = document.getElementById('promotionId');
    const groupSelect = document.getElementById('groupId');
    if (!promotionSelect || !groupSelect) {
      return;
    }
    const options = Array.from(groupSelect.querySelectorAll('option[data-promotion-id]'));

    function filterGroups() {
      const promotionId = promotionSelect.value;
      options.forEach(function (option) {
        const matches = !promotionId || option.getAttribute('data-promotion-id') === promotionId;
        option.hidden = !matches;
        if (!matches && option.selected) {
          groupSelect.value = '';
        }
      });
    }

    promotionSelect.addEventListener('change', filterGroups);
    filterGroups();
  })();
</script>
</body>
</html>

server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=5000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.properties.hibernate.auto_quote_keyword=true

spring.flyway.enabled=true

# Prefer APP_JWT_SECRET; JWT_SECRET kept as local alias
app.jwt.secret=${APP_JWT_SECRET:${JWT_SECRET}}
app.jwt.expiration-seconds=${APP_JWT_EXPIRATION_SECONDS:86400}

aws.eventBridge.bus=${AWS_EVENTBRIDGE_BUS:dummy-bus}
aws.s3.bucket=${AWS_S3_BUCKET:dummy-bucket}

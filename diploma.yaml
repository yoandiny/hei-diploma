openapi: 3.0.3
info:
  title: HEI Diplômés - Auth API
  description: >
    Authentication & authorization endpoints for the HEI graduates management API.
    Issues short-lived JWT access tokens and long-lived opaque refresh tokens.
    Role is embedded in the access token so downstream endpoints can authorize
    STUDENT / TEACHER / ADMIN access without an extra DB round-trip.
  version: "1.0.0"

servers:
  - url: /api

tags:
  - name: Auth

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate with email/password and obtain tokens
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a valid refresh token for a new access token
      operationId: refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Refresh token invalid, expired or revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the given refresh token (client should also drop the access token)
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Token revoked

  /auth/me:
    get:
      tags: [Auth]
      summary: Return the currently authenticated user, including role
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Missing or invalid token

  /auth/register:
    post:
      tags: [Auth]
      summary: Create a new account (ADMIN only - students/teachers are provisioned by an admin)
      operationId: registerUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '403':
          description: Caller is not ADMIN
        '409':
          description: Email already in use

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Role:
      type: string
      enum: [STUDENT, TEACHER, ADMIN]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: Short-lived JWT (e.g. 15 min), contains sub, role, exp claims
        refreshToken:
          type: string
          description: Opaque long-lived token (e.g. 30 days), stored hashed server-side
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: Access token TTL in seconds

    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        firstName:
          type: string
        lastName:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

security:
  - bearerAuth: []
  /admin/grades/grade-history.html:
    get:
      tags: [Admin]
      summary: Display an administrator grade history
      operationId: adminGradeHistoryDetail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GradeIdQuery'
        - $ref: '#/components/parameters/ExamIdQuery'
        - $ref: '#/components/parameters/GroupIdRequiredQuery'
        - $ref: '#/components/parameters/CourseIdRequiredQuery'
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '302':
          $ref: '#/components/responses/Redirect'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/promotion/results.html:
    get:
      tags: [Admin]
      summary: Display graduates for a selected promotion
      operationId: adminPromotionResults
      security:
        - bearerAuth: []
      parameters:
        - name: promotionId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/promotion/graduates.xlsx:
    get:
      tags: [Admin]
      summary: Export promotion graduates as XLSX
      operationId: exportGraduatesExcel
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PromotionIdRequiredQuery'
      responses:
        '200':
          description: XLSX export
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Promotion not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    HtmlPage:
      description: HTML page
      content:
        text/html:
          schema:
            type: string
    Redirect:
      description: Redirect to another web page
      headers:
        Location:
          schema:
            type: string
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated user does not have the required role
      content:
        text/html:
          schema:
            type: string
    BadRequest:
      description: Invalid form data or business rule violation
      content:
        text/html:
          schema:
            type: string

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdQuery:
      name: id
      in: query
      required: true
      schema:
        type: string
        format: uuid
    OptionalIdQuery:
      name: id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    PromotionId:
      name: promotionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PromotionIdRequiredQuery:
      name: promotionId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    CourseIdPath:
      name: courseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CourseIdQuery:
      name: courseId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    CourseIdRequiredQuery:
      name: courseId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    ExamIdQuery:
      name: examId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    GradeIdQuery:
      name: gradeId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    GroupIdQuery:
      name: groupId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    GroupIdRequiredQuery:
      name: groupId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    RedirectQuery:
      name: redirect
      in: query
      required: false
      schema:
        type: string
        enum: [profile]
    NbEvent:
      name: nbEvent
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 1
    WaitInSeconds:
      name: waitInSeconds
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 2

  schemas:
    Role:
      type: string
      enum: [STUDENT, TEACHER, ADMIN]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, userId, role]
      properties:
        accessToken:
          type: string
          description: JWT access token containing the user identity and role
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: Access token TTL in seconds
        userId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/Role'

    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        firstName:
          type: string
        lastName:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    StudentSummary:
      type: object
      properties:
        id: {type: string, format: uuid}
        studentNumber: {type: string}
        firstName: {type: string, nullable: true}
        lastName: {type: string, nullable: true}
        email: {type: string, format: email, nullable: true}
        groupRef: {type: string, nullable: true}
        promotionLabel: {type: string, nullable: true}
        promotionStartYear: {type: integer, nullable: true}

    GraduatedStudent:
      type: object
      properties:
        id: {type: string, format: uuid}
        studentNumber: {type: string}
        firstName: {type: string, nullable: true}
        lastName: {type: string, nullable: true}
        email: {type: string, format: email, nullable: true}
        groupRef: {type: string, nullable: true}
        promotionLabel: {type: string, nullable: true}
        promotionStartYear: {type: integer, nullable: true}
        promotionEndYear: {type: integer, nullable: true}
        weightedAverage: {type: number, format: double, nullable: true}

    Transcript:
      type: object
      properties:
        studentId: {type: string, format: uuid}
        studentNumber: {type: string}
        firstName: {type: string, nullable: true}
        lastName: {type: string, nullable: true}
        email: {type: string, format: email, nullable: true}
        promotionLabel: {type: string, nullable: true}
        promotionStartYear: {type: integer, nullable: true}
        promotionEndYear: {type: integer, nullable: true}
        groupRef: {type: string, nullable: true}
        grades:
          type: array
          items:
            $ref: '#/components/schemas/TranscriptGrade'
        weightedAverage: {type: number, format: double, nullable: true}

    TranscriptGrade:
      type: object
      properties:
        id: {type: string, format: uuid}
        courseRef: {type: string, nullable: true}
        courseTitle: {type: string, nullable: true}
        examDate: {type: string, format: date-time, nullable: true}
        coefficient: {type: number, format: double, nullable: true}
        value: {type: number, format: double, nullable: true}
        gradedAt: {type: string, format: date-time, nullable: true}

    TeacherExamForm:
      type: object
      required: [courseId, dateExam, coefficient, groupIds]
      properties:
        courseId: {type: string, format: uuid}
        dateExam: {type: string, description: Local date-time in Africa/Nairobi}
        coefficient: {type: number, format: double, exclusiveMinimum: 0}
        groupIds:
          type: array
          items: {type: string, format: uuid}

    ExamSubmitForm:
      type: object
      required: [examId]
      properties:
        examId: {type: string, format: uuid}

    GradeForm:
      type: object
      required: [examId, studentId, value]
      properties:
        examId: {type: string, format: uuid}
        groupId: {type: string, format: uuid}
        studentId: {type: string, format: uuid}
        value: {type: number, format: double, minimum: 0}
        reason: {type: string}

    AdminGradeForm:
      allOf:
        - $ref: '#/components/schemas/GradeForm'
      description: GradeForm with required groupId and courseId for administrator navigation

    StudentForm:
      type: object
      required: [firstName, lastName, email, studentNumber, promotionId, password]
      properties:
        firstName: {type: string}
        lastName: {type: string}
        email: {type: string, format: email}
        studentNumber: {type: string}
        promotionId: {type: string, format: uuid}
        groupId: {type: string, format: uuid}
        password: {type: string, format: password}
        enabled: {type: boolean, default: false}

    TeacherForm:
      type: object
      required: [firstName, lastName, email, employeeNumber]
      properties:
        id: {type: string, format: uuid}
        firstName: {type: string}
        lastName: {type: string}
        email: {type: string, format: email}
        employeeNumber: {type: string}
        password: {type: string, format: password}
        enabled: {type: boolean, default: false}

    GroupForm:
      type: object
      required: [ref, promotionId]
      properties:
        id: {type: string, format: uuid}
        ref: {type: string}
        promotionId: {type: string, format: uuid}

    GroupChangeForm:
      type: object
      required: [groupId]
      properties:
        groupId: {type: string, format: uuid}

    PromotionForm:
      type: object
      required: [label, startYear, endYear]
      properties:
        id: {type: string, format: uuid}
        label: {type: string}
        startYear: {type: integer}
        endYear: {type: integer}

    CourseForm:
      type: object
      required: [ref, title, credits]
      properties:
        id: {type: string, format: uuid}
        ref: {type: string}
        title: {type: string}
        credits: {type: integer, minimum: 0}

    CourseAssignmentForm:
      type: object
      required: [teacherId]
      properties:
        teacherId: {type: string, format: uuid}
        groupIds:
          type: array
          items: {type: string, format: uuid}

security:
  - bearerAuth: []
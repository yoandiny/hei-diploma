  /admin/grades/save:
    post:
      tags: [Admin]
      summary: Create or update an administrator grade
      operationId: saveAdminGrade
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminGradeForm'
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        '400':
          $ref: '#/components/responses/BadRequest'

  /admin/grades/select-group.html:
    get:
      tags: [Admin]
      summary: Select an exam group for grade management
      operationId: adminSelectGroup
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ExamIdQuery'
        - $ref: '#/components/parameters/CourseIdRequiredQuery'
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '302':
          $ref: '#/components/responses/Redirect'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/grades/edit.html:
    get:
      tags: [Admin]
      summary: Display the administrator grade sheet
      operationId: adminGradesEdit
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ExamIdQuery'
        - $ref: '#/components/parameters/GroupIdRequiredQuery'
        - $ref: '#/components/parameters/CourseIdRequiredQuery'
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '302':
          $ref: '#/components/responses/Redirect'

openapi: 3.0.3
info:
  title: HEI Graduates - API and web interface
  description: >
    REST API and web routes for the student, grades and graduates management application.
    REST endpoints use JWT authentication. HTML routes are handled by Thymeleaf
    controllers and protected by role.
  version: "1.0.0"

servers:
  - url: /

tags:
  - name: Auth
  - name: Student
  - name: Teacher
  - name: Admin
  - name: Health
  - name: Web

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate with email/password and obtain tokens
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/students:
    get:
      tags: [Admin]
      summary: List all students
      operationId: listStudents
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Student list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentSummary'
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not ADMIN

  /admin/students/verify-emails:
    post:
      tags: [Admin]
      summary: Request email verification for all students
      operationId: verifyAllStudentEmails
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Verification events accepted
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not ADMIN

  /admin/promotions/{promotionId}/graduates:
    get:
      tags: [Admin]
      summary: List graduates of a promotion
      operationId: listGraduates
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PromotionId'
      responses:
        '200':
          description: Graduated students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GraduatedStudent'
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not ADMIN
        '404':
          description: Promotion not found

  /students/me/transcript:
    get:
      tags: [Student]
      summary: Return the authenticated student's transcript
      operationId: getOwnTranscript
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Student transcript
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcript'
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not STUDENT
        '404':
          description: Transcript not found

  /students/me/transcript/email:
    post:
      tags: [Student]
      summary: Request the authenticated student's transcript by email
      operationId: emailOwnTranscript
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Email request accepted
        '303':
          description: HTML clients are redirected to the grades page
          headers:
            Location:
              schema:
                type: string
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not STUDENT
        '404':
          description: Transcript not found

  /ping:
    get:
      tags: [Health]
      summary: Check application availability
      operationId: ping
      security: []
      responses:
        '200':
          description: Application is available
          content:
            text/plain:
              schema:
                type: string
                example: pong

  /health/db:
    get:
      tags: [Health]
      summary: Check database connectivity and seed data
      operationId: healthDb
      security: []
      responses:
        '200':
          description: Database check succeeded
          content:
            text/plain:
              schema:
                type: string
                example: OK
        '500':
          description: Database check failed

  /health/email:
    get:
      tags: [Health]
      summary: Exercise email delivery features
      operationId: healthEmail
      security: []
      parameters:
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Email checks succeeded
          content:
            text/plain:
              schema:
                type: string
                example: OK
        '400':
          description: Invalid email address

  /health/bucket:
    get:
      tags: [Health]
      summary: Exercise file upload, download and presigning
      operationId: healthBucket
      security: []
      responses:
        '200':
          description: Bucket checks succeeded; body contains a presigned URL
          content:
            text/plain:
              schema:
                type: string
                format: uri
        '500':
          description: Bucket check failed

  /health/event1:
    get:
      tags: [Health]
      summary: Publish first durable event type
      operationId: healthEvent1
      security: []
      parameters:
        - $ref: '#/components/parameters/NbEvent'
        - $ref: '#/components/parameters/WaitInSeconds'
      responses:
        '200':
          description: Generated event UUIDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
        '400':
          description: nbEvent must be between 1 and 500

  /health/event2:
    get:
      tags: [Health]
      summary: Publish second durable event type
      operationId: healthEvent2
      security: []
      parameters:
        - $ref: '#/components/parameters/NbEvent'
        - $ref: '#/components/parameters/WaitInSeconds'
      responses:
        '200':
          description: Generated event UUIDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
        '400':
          description: nbEvent must be between 1 and 500

  /health/event/uuids:
    post:
      tags: [Health]
      summary: Check that event UUIDs were persisted
      operationId: checkEventUuids
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: uuid
      responses:
        '200':
          description: All UUIDs were persisted
          content:
            text/plain:
              schema:
                type: string
                example: OK
        '500':
          description: At least one UUID was not persisted

  /:
    get:
      tags: [Web]
      summary: Display the login page or redirect the authenticated user
      operationId: webHome
      security: []
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '302':
          $ref: '#/components/responses/Redirect'

  /login:
    get:
      tags: [Web]
      summary: Display the login page or redirect the authenticated user
      operationId: webLogin
      security: []
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '302':
          $ref: '#/components/responses/Redirect'

  /forbidden:
    get:
      tags: [Web]
      summary: Display the forbidden access page
      operationId: webForbidden
      security: []
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'

  /student/dashboard.html:
    get:
      tags: [Student]
      summary: Display the student dashboard
      operationId: studentDashboard
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /student/profile.html:
    get:
      tags: [Student]

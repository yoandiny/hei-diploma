      operationId: deleteCourseAssignment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: courseId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/grades/home.html:
    get:
      tags: [Admin]
      summary: Display course selection for grade management
      operationId: adminGradesHome
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/grades.html:
    get:
      tags: [Admin]
      summary: Display course selection for grade management
      operationId: adminGradesHomeAlias
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
